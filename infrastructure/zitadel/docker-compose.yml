name: agent-trust-zitadel

services:
  postgres:
    image: postgres:17.2-alpine
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: local-postgres-password
      POSTGRES_DB: zitadel
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -d zitadel -U postgres"]
      interval: 2s
      timeout: 5s
      retries: 30
    volumes:
      - postgres-data:/var/lib/postgresql/data

  zitadel:
    image: ghcr.io/zitadel/zitadel:v4.15.0
    user: "0"
    command: start-from-init --masterkey "atb-local-masterkey-000000000000" --tlsMode disabled
    environment:
      ZITADEL_PORT: 8080
      ZITADEL_EXTERNALDOMAIN: localhost
      ZITADEL_EXTERNALPORT: 28080
      ZITADEL_EXTERNALSECURE: "false"
      ZITADEL_TLS_ENABLED: "false"
      ZITADEL_DATABASE_POSTGRES_DSN: postgresql://postgres:local-postgres-password@postgres:5432/zitadel?sslmode=disable
      ZITADEL_FIRSTINSTANCE_PATPATH: /zitadel/bootstrap/admin.pat
      ZITADEL_FIRSTINSTANCE_INSTANCENAME: ATB E001
      ZITADEL_FIRSTINSTANCE_ORG_NAME: ATB E001
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_USERNAME: human-e001
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_FIRSTNAME: E001
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_LASTNAME: Human
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_ADDRESS: human-e001@example.invalid
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_EMAIL_VERIFIED: "true"
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORD: LocalHumanPassword1!
      ZITADEL_FIRSTINSTANCE_ORG_HUMAN_PASSWORDCHANGEREQUIRED: "false"
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_USERNAME: atb-admin-service
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_MACHINE_NAME: ATB bootstrap administrator
      ZITADEL_FIRSTINSTANCE_ORG_MACHINE_PAT_EXPIRATIONDATE: "2099-01-01T00:00:00Z"
      ZITADEL_LOGSTORE_ACCESS_STDOUT_ENABLED: "true"
    ports:
      - 127.0.0.1:28080:8080
    volumes:
      - ./runtime:/zitadel/bootstrap
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "/app/zitadel", "ready"]
      interval: 3s
      timeout: 10s
      retries: 40
      start_period: 20s

  opa:
    image: openpolicyagent/opa:1.19.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--config-file=/config/opa.yaml", "/policy/policy.rego"]
    ports:
      - 127.0.0.1:28181:8181
    volumes:
      - ../keycloak-opa/policy.rego:/policy/policy.rego:ro
      - ../keycloak-opa/opa.yaml:/config/opa.yaml:ro
    healthcheck:
      test: ["CMD", "/opa", "eval", "1+1"]
      interval: 2s
      timeout: 5s
      retries: 20

volumes:
  postgres-data:
